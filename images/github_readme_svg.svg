<svg width="1200" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient animasyonlu -->
    <linearGradient id="animGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00fff2">
        <animate attributeName="stop-color" values="#00fff2;#0080ff;#00fff2" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#0080ff">
        <animate attributeName="stop-color" values="#0080ff;#00fff2;#0080ff" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#00fff2">
        <animate attributeName="stop-color" values="#00fff2;#0080ff;#00fff2" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <!-- Neon glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="10" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Güçlü glow -->
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Arkaplan transparan -->
  <rect width="1200" height="400" fill="transparent"/>
  
  <!-- Partiküller - animasyonlu -->
  <circle cx="200" cy="150" r="3" fill="#00fff2" opacity="0.6">
    <animate attributeName="cy" values="150;120;150" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="250" r="3" fill="#0080ff" opacity="0.6">
    <animate attributeName="cy" values="250;280;250" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="300" r="2" fill="#00fff2" opacity="0.5">
    <animate attributeName="cx" values="300;320;300" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="100" r="2" fill="#0080ff" opacity="0.5">
    <animate attributeName="cx" values="900;880;900" dur="6s" repeatCount="indefinite"/>
  </circle>
  
  <!-- İsim - Ana beyaz text -->
  <text x="600" y="180" 
        font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" 
        font-size="75" 
        font-weight="500" 
        text-anchor="middle" 
        letter-spacing="8"
        fill="#ffffff">
    Ali Enes ERSÖZLÜ
  </text>
  
  <!-- İsim - Neon overlay -->
  <text x="600" y="180" 
        font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" 
        font-size="75" 
        font-weight="500" 
        text-anchor="middle" 
        letter-spacing="8"
        fill="url(#animGrad)"
        opacity="0.7"
        filter="url(#glow)">
    Ali Enes ERSÖZLÜ
  </text>
  
  <!-- Decorative line - animasyonlu -->
  <line x1="600" y1="200" x2="600" y2="200" 
        stroke="url(#animGrad)" 
        stroke-width="2" 
        filter="url(#glow)">
    <animate attributeName="x1" from="600" to="400" dur="1.5s" fill="freeze"/>
    <animate attributeName="x2" from="600" to="800" dur="1.5s" fill="freeze"/>
  </line>
  
  <!-- Software Developer - fade in animasyonlu -->
  <text x="600" y="245" 
        font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" 
        font-size="20" 
        font-weight="400" 
        text-anchor="middle" 
        letter-spacing="6"
        fill="#8899aa"
        opacity="0">
    SOFTWARE DEVELOPER
    <animate attributeName="opacity" from="0" to="1" begin="1s" dur="1s" fill="freeze"/>
  </text>
  
  <!-- Renk değiştiren alt çizgi -->
  <line x1="450" y1="260" x2="750" y2="260" 
        stroke="url(#animGrad)" 
        stroke-width="2" 
        filter="url(#glow)"
        opacity="0">
    <animate attributeName="opacity" from="0" to="0.8" begin="1.5s" dur="0.8s" fill="freeze"/>
  </line>
  
  <!-- Yan efekt noktaları - pulse animasyonlu -->
  <circle cx="400" cy="200" r="4" fill="url(#animGrad)" filter="url(#strongGlow)">
    <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="200" r="4" fill="url(#animGrad)" filter="url(#strongGlow)">
    <animate attributeName="r" values="4;6;4" dur="2s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Kod sembolleri - fade in -->
  <text x="360" y="185" 
        font-family="'Courier New', monospace" 
        font-size="24" 
        fill="url(#animGrad)" 
        opacity="0"
        filter="url(#glow)">
    &lt;/&gt;
    <animate attributeName="opacity" from="0" to="0.6" begin="1.5s" dur="0.8s" fill="freeze"/>
  </text>
  <text x="810" y="185" 
        font-family="'Courier New', monospace" 
        font-size="24" 
        fill="url(#animGrad)" 
        opacity="0"
        filter="url(#glow)">
    { }
    <animate attributeName="opacity" from="0" to="0.6" begin="1.5s" dur="0.8s" fill="freeze"/>
  </text>
</svg>
