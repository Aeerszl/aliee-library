<svg width="1200" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Neon gradient -->
    <linearGradient id="neon1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00fff2"/>
      <stop offset="100%" style="stop-color:#0080ff"/>
    </linearGradient>
    
    <linearGradient id="neon2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff00ff"/>
      <stop offset="100%" style="stop-color:#00fff2"/>
    </linearGradient>
    
    <!-- Güçlü neon glow -->
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feGaussianBlur stdDeviation="15" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Hex pattern -->
    <pattern id="hexPattern" x="0" y="0" width="60" height="52" patternUnits="userSpaceOnUse">
      <path d="M30 0 L45 13 L45 39 L30 52 L15 39 L15 13 Z" 
            fill="none" 
            stroke="#00fff2" 
            stroke-width="0.5" 
            opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Arkaplan - Koyu -->
  <rect width="1200" height="400" fill="#000000"/>
  
  <!-- Hex pattern overlay -->
  <rect width="1200" height="400" fill="url(#hexPattern)"/>
  
  <!-- Büyük parlama efektleri -->
  <circle cx="300" cy="200" r="250" fill="#00fff2" opacity="0.08" filter="url(#neonGlow)"/>
  <circle cx="900" cy="200" r="250" fill="#0080ff" opacity="0.08" filter="url(#neonGlow)"/>
  
  <!-- Diagonal lines -->
  <line x1="0" y1="100" x2="400" y2="100" stroke="url(#neon1)" stroke-width="2" opacity="0.3" filter="url(#neonGlow)"/>
  <line x1="800" y1="300" x2="1200" y2="300" stroke="url(#neon1)" stroke-width="2" opacity="0.3" filter="url(#neonGlow)"/>
  
  <!-- Neon circles -->
  <circle cx="150" cy="100" r="6" fill="#00fff2" opacity="0.8" filter="url(#neonGlow)"/>
  <circle cx="1050" cy="300" r="6" fill="#0080ff" opacity="0.8" filter="url(#neonGlow)"/>
  <circle cx="200" cy="320" r="4" fill="#00fff2" opacity="0.6" filter="url(#neonGlow)"/>
  <circle cx="1000" cy="80" r="4" fill="#0080ff" opacity="0.6" filter="url(#neonGlow)"/>
  
  <!-- Ana yazı - Çok kalın beyaz base -->
  <text x="600" y="180" 
        font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" 
        font-size="100" 
        font-weight="900" 
        text-anchor="middle" 
        letter-spacing="8"
        fill="#ffffff">
    Ali Enes
  </text>
  
  <!-- Neon overlay - Ali Enes -->
  <text x="600" y="180" 
        font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" 
        font-size="100" 
        font-weight="900" 
        text-anchor="middle" 
        letter-spacing="8"
        fill="url(#neon1)"
        opacity="0.9"
        filter="url(#neonGlow)">
    Ali Enes
  </text>
  
  <!-- ERSÖZLÜ - Beyaz base -->
  <text x="600" y="270" 
        font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" 
        font-size="90" 
        font-weight="900" 
        text-anchor="middle" 
        letter-spacing="12"
        fill="#ffffff">
    ERSÖZLÜ
  </text>
  
  <!-- ERSÖZLÜ - Neon overlay -->
  <text x="600" y="270" 
        font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" 
        font-size="90" 
        font-weight="900" 
        text-anchor="middle" 
        letter-spacing="12"
        fill="url(#neon1)"
        opacity="0.8"
        filter="url(#neonGlow)">
    ERSÖZLÜ
  </text>
  
  <!-- Decorative lines -->
  <line x1="250" y1="200" x2="400" y2="200" stroke="url(#neon1)" stroke-width="3" opacity="0.6" filter="url(#neonGlow)"/>
  <line x1="800" y1="200" x2="950" y2="200" stroke="url(#neon1)" stroke-width="3" opacity="0.6" filter="url(#neonGlow)"/>
  
  <!-- Corner accents -->
  <circle cx="250" cy="200" r="5" fill="url(#neon1)" filter="url(#neonGlow)"/>
  <circle cx="950" cy="200" r="5" fill="url(#neon1)" filter="url(#neonGlow)"/>
</svg>
